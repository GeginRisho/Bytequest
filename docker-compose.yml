version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bytequest-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: bytequest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bytequest-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: bytequest-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:1234@postgres:5432/bytequest?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=super_secret_access_key_12345
      - JWT_REFRESH_SECRET=super_secret_refresh_key_12345
      - PORT=5000
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: bytequest-frontend
    restart: always
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:5000/api/v1
      - EXPO_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
